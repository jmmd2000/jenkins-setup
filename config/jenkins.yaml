jenkins:
  numExecutors: 1
  slaveAgentPort: -1
  globalNodeProperties:
    - envVars:
        env:
          - key: "VPS_HOST"
            value: "${VPS_HOST}"
          - key: "VPS_USER"
            value: "${VPS_USER}"
          - key: "GHCR_USER"
            value: "${GHCR_USER}"

appearance:
  themeManager:
    theme: "dark"

unclassified:
  location:
    url: "http://localhost:8081/"
  timestamper:
    allPipelines: true
  ansiColorBuildWrapper:
    globalColorMapName: "xterm"
  globalLibraries:
    libraries:
      - name: "deploy"
        defaultVersion: "master"
        allowVersionOverride: true
        retriever:
          modernSCM:
            libraryPath: "lib/"
            scm:
              gitSource:
                remote: "/home/jamesmddoyle/projects/jenkins-setup"
